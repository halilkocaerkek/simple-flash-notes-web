<svg width="250" height="541" viewBox="0 0 250 541" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone Frame -->
  <rect width="250" height="541" rx="25" fill="#000000"/>
  <rect x="5" y="5" width="240" height="531" rx="20" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <rect x="5" y="5" width="240" height="44" fill="#F2F2F7"/>
  <text x="25" y="28" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#000000">9:41</text>
  <circle cx="210" cy="25" r="3" fill="#34C759"/>
  <rect x="215" y="20" width="15" height="8" rx="2" stroke="#000000" stroke-width="1" fill="none"/>
  <rect x="217" y="22" width="11" height="4" fill="#34C759"/>

  <!-- Navigation Bar -->
  <rect x="5" y="49" width="240" height="44" fill="#FFFFFF"/>
  <text x="20" y="68" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#007AFF">Back</text>
  <text x="125" y="75" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="middle">Edit Note</text>
  <text x="220" y="68" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#007AFF" text-anchor="end">Save</text>

  <!-- Front Side Section -->
  <text x="20" y="115" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#007AFF">Front</text>
  <rect x="200" y="105" width="35" height="20" rx="10" fill="#007AFF"/>
  <text x="217" y="117" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#FFFFFF" text-anchor="middle">+ IMG</text>

  <!-- Front Text Editor -->
  <rect x="15" y="125" width="220" height="120" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
  <text x="25" y="145" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#000000">What is photosynthesis?</text>

  <!-- Front Image Placeholder -->
  <rect x="25" y="155" width="100" height="80" rx="8" fill="#E5E5EA"/>
  <circle cx="75" cy="195" r="15" fill="#FFFFFF"/>
  <text x="70" y="200" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">📷</text>

  <!-- Divider -->
  <rect x="20" y="265" width="210" height="1" fill="#E5E5EA"/>

  <!-- Back Side Section -->
  <text x="20" y="285" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#007AFF">Back</text>
  <rect x="200" y="275" width="35" height="20" rx="10" fill="#007AFF"/>
  <text x="217" y="287" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#FFFFFF" text-anchor="middle">+ IMG</text>

  <!-- Back Text Editor -->
  <rect x="15" y="295" width="220" height="120" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
  <text x="25" y="315" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#000000">The process by which plants convert</text>
  <text x="25" y="335" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#000000">sunlight, carbon dioxide, and water</text>
  <text x="25" y="355" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#000000">into glucose and oxygen.</text>
  <text x="25" y="385" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#000000">6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂</text>

  <!-- Keyboard -->
  <rect x="5" y="440" width="240" height="96" fill="#D1D1D6"/>
  <rect x="10" y="445" width="230" height="86" rx="8" fill="#FFFFFF"/>

  <!-- Keyboard Keys (simplified) -->
  <rect x="20" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="32" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">Q</text>

  <rect x="50" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="62" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">W</text>

  <rect x="80" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="92" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">E</text>

  <rect x="110" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="122" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">R</text>

  <rect x="140" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="152" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">T</text>

  <rect x="170" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="182" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">Y</text>

  <rect x="200" y="455" width="25" height="25" rx="4" fill="#F2F2F7"/>
  <text x="212" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">U</text>

  <!-- Space bar -->
  <rect x="60" y="500" width="130" height="25" rx="4" fill="#F2F2F7"/>
  <text x="125" y="515" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000" text-anchor="middle">space</text>
</svg>