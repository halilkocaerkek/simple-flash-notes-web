  <circle cx="350" cy="241" r="8" fill="#E5E5EA"/>
  <text x="346" y="245" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">🔊</text>

  <text x="194" y="260" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#000000">Process plants use to convert light...</text>
