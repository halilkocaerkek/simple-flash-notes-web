<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPad Frame -->
  <rect width="400" height="300" rx="20" fill="#000000"/>
  <rect x="3" y="3" width="394" height="294" rx="17" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <rect x="3" y="3" width="394" height="30" fill="#F2F2F7"/>
  <text x="15" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#000000">9:41 AM</text>
  <circle cx="360" cy="18" r="3" fill="#34C759"/>
  <rect x="365" y="14" width="20" height="8" rx="2" stroke="#000000" stroke-width="1" fill="none"/>
  <rect x="367" y="16" width="16" height="4" fill="#34C759"/>

  <!-- Navigation Bar -->
  <rect x="3" y="33" width="394" height="40" fill="#FFFFFF"/>
  <text x="15" y="50" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#007AFF">Settings</text>
  <text x="200" y="57" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="middle">Export & Sync</text>

  <!-- Split View Container -->
  <rect x="3" y="73" width="394" height="221" fill="#E5E5EA"/>

  <!-- Left Panel - Folder List -->
  <rect x="3" y="73" width="190" height="221" fill="#F8F9FA"/>

  <!-- Folder to Export -->
  <text x="15" y="95" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#000000">Select Folder to Share</text>

  <!-- Math Formulas Folder - Selected -->
  <rect x="15" y="105" width="170" height="60" rx="8" fill="#007AFF" fill-opacity="0.1" stroke="#007AFF" stroke-width="2"/>
  <rect x="25" y="115" width="35" height="35" rx="6" fill="#007AFF" fill-opacity="0.3"/>
  <text x="40" y="135" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#007AFF">📐</text>
  <text x="70" y="125" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#000000">Math Formulas</text>
  <text x="70" y="140" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">12 notes</text>
  <text x="70" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">Created 2 weeks ago</text>
  <circle cx="165" cy="132" r="8" fill="#007AFF"/>
  <path d="M161 132 L164 135 L169 130" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <!-- Biology Folder -->
  <rect x="15" y="175" width="170" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="25" y="185" width="30" height="30" rx="4" fill="#FF3B30" fill-opacity="0.2"/>
  <text x="37" y="202" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FF3B30">🧬</text>
  <text x="65" y="195" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#000000">Biology</text>
  <text x="65" y="210" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">24 notes</text>

  <!-- Spanish Folder -->
  <rect x="15" y="235" width="170" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="25" y="245" width="30" height="30" rx="4" fill="#FF9500" fill-opacity="0.2"/>
  <text x="37" y="262" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FF9500">🇪🇸</text>
  <text x="65" y="255" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#000000">Spanish</text>
  <text x="65" y="270" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">18 notes</text>

  <!-- Divider -->
  <rect x="193" y="73" width="1" height="221" fill="#C6C6C8"/>

  <!-- Right Panel - Export Options -->
  <rect x="194" y="73" width="203" height="221" fill="#FFFFFF"/>

  <!-- CloudKit Sync Status -->
  <rect x="204" y="83" width="183" height="50" rx="8" fill="#34C759" fill-opacity="0.1"/>
  <circle cx="220" cy="100" r="8" fill="#34C759"/>
  <path d="M216 100 L219 103 L224 98" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <text x="235" y="95" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34C759">iCloud Sync Active</text>
  <text x="235" y="110" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">All devices synchronized</text>
  <text x="235" y="125" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">Last sync: 1 minute ago</text>

  <!-- Share Options -->
  <text x="204" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#000000">Share via AirDrop</text>

  <!-- Export Preview -->
  <rect x="204" y="165" width="183" height="40" rx="8" fill="#F8F9FA" stroke="#E5E5EA" stroke-width="1"/>
  <text x="214" y="180" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#000000">math_formulas.simpleflashnotes</text>
  <text x="214" y="195" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#8E8E93">145 KB • 12 notes • 3 subfolders</text>

  <!-- AirDrop Devices -->
  <rect x="204" y="215" width="183" height="70" rx="8" fill="#F8F9FA"/>
  <text x="214" y="232" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#000000">Nearby Devices</text>

  <!-- Device Icons -->
  <circle cx="235" cy="250" r="12" fill="#E5E5EA"/>
  <text x="230" y="255" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">👤</text>
  <text x="235" y="270" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#000000" text-anchor="middle">Sarah</text>

  <circle cx="265" cy="250" r="12" fill="#E5E5EA"/>
  <text x="260" y="255" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">💻</text>
  <text x="265" y="270" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#000000" text-anchor="middle">MacBook</text>

  <circle cx="295" cy="250" r="12" fill="#E5E5EA"/>
  <text x="290" y="255" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">📱</text>
  <text x="295" y="270" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#000000" text-anchor="middle">iPhone</text>

  <circle cx="325" cy="250" r="12" fill="#E5E5EA"/>
  <text x="320" y="255" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">📱</text>
  <text x="325" y="270" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#000000" text-anchor="middle">iPad</text>

  <!-- Share Button -->
  <rect x="350" y="240" width="30" height="20" rx="10" fill="#007AFF"/>
  <text x="365" y="252" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Share</text>
</svg>