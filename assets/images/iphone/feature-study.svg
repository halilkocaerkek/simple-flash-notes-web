<svg width="250" height="541" viewBox="0 0 250 541" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone Frame -->
  <rect width="250" height="541" rx="25" fill="#000000"/>
  <rect x="5" y="5" width="240" height="531" rx="20" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <rect x="5" y="5" width="240" height="44" fill="#F2F2F7"/>
  <text x="25" y="28" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#000000">9:41</text>
  <circle cx="210" cy="25" r="3" fill="#34C759"/>
  <rect x="215" y="20" width="15" height="8" rx="2" stroke="#000000" stroke-width="1" fill="none"/>
  <rect x="217" y="22" width="11" height="4" fill="#34C759"/>

  <!-- Navigation Bar -->
  <rect x="5" y="49" width="240" height="44" fill="#FFFFFF"/>
  <text x="20" y="68" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#007AFF">Close</text>
  <text x="125" y="75" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="middle">Test Mode</text>
  <text x="220" y="68" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#007AFF" text-anchor="end">⋯</text>

  <!-- Progress Bar -->
  <rect x="15" y="103" width="220" height="4" rx="2" fill="#E5E5EA"/>
  <rect x="15" y="103" width="88" height="4" rx="2" fill="#007AFF"/>

  <!-- Progress Text -->
  <text x="20" y="125" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">2 of 5</text>
  <text x="215" y="125" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93" text-anchor="end">3 remaining</text>

  <!-- Timer -->
  <rect x="15" y="135" width="220" height="40" rx="20" fill="#FF3B30" fill-opacity="0.1"/>
  <circle cx="35" cy="155" r="8" fill="#FF3B30"/>
  <text x="30" y="159" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">⏱</text>
  <text x="55" y="160" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FF3B30">8s</text>

  <!-- Flashcard -->
  <rect x="15" y="195" width="220" height="200" rx="16" fill="#FFFFFF" stroke="#007AFF" stroke-width="2"/>

  <!-- Card Header -->
  <text x="25" y="215" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#8E8E93">Question</text>

  <!-- Card Content -->
  <text x="125" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="middle">What is the formula for</text>
  <text x="125" y="275" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="middle">photosynthesis?</text>

  <!-- Plant Icon -->
  <circle cx="125" cy="320" r="25" fill="#34C759" fill-opacity="0.2"/>
  <text x="115" y="330" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" fill="#34C759">🌱</text>

  <!-- Tap to Reveal Hint -->
  <text x="125" y="370" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93" text-anchor="middle">Tap to reveal answer</text>

  <!-- Action Button -->
  <rect x="40" y="420" width="170" height="50" rx="25" fill="#007AFF"/>
  <text x="125" y="450" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reveal Answer</text>

  <!-- Tab Bar -->
  <rect x="5" y="492" width="240" height="44" fill="#F2F2F7"/>
  <rect x="5" y="492" width="240" height="1" fill="#C6C6C8"/>
  <text x="120" y="520" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#007AFF" text-anchor="middle">Study</text>
</svg>