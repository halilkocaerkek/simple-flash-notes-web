  <text x="25" y="440" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">math_formulas.simpleflashnotes</text>
  <text x="25" y="455" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8E8E93">142 KB • 12 notes included</text>

