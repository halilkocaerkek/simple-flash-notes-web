  <!-- Sync Status -->
  <rect x="15" y="113" width="220" height="80" rx="12" fill="#34C759" fill-opacity="0.1"/>
  <circle cx="35" cy="135" r="12" fill="#34C759"/>
  <path d="M30 135 L34 139 L42 131" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="55" y="135" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#34C759">Sync Active</text>
