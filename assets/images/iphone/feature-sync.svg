  <rect x="175" y="255" width="50" height="30" rx="15" fill="#007AFF"/>
  <text x="200" y="273" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Share</text>

  <!-- AirDrop Interface -->
  <rect x="15" y="325" width="220" height="140" rx="12" fill="#F8F9FA"/>
  <text x="25" y="345" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#000000">AirDrop</text>

  <!-- Nearby Devices -->
  <circle cx="70" cy="385" r="25" fill="#E5E5EA"/>
  <text x="62" y="391" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#8E8E93">👤</text>
  <text x="70" y="415" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="middle">Sarah's iPhone</text>

  <circle cx="125" cy="385" r="25" fill="#E5E5EA"/>
  <text x="117" y="391" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#8E8E93">💻</text>
  <text x="125" y="415" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="middle">MacBook Pro</text>

  <circle cx="180" cy="385" r="25" fill="#E5E5EA"/>
  <text x="172" y="391" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#8E8E93">📱</text>
  <text x="180" y="415" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="middle">iPad Pro</text>

