  <!-- Folder to Share -->
  <rect x="15" y="235" width="220" height="70" rx="12" fill="#FFFFFF"/>
  <rect x="25" y="245" width="40" height="40" rx="8" fill="#007AFF" fill-opacity="0.2"/>
  <text x="40" y="268" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#007AFF">📐</text>
  <text x="75" y="260" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#000000">Math Formulas</text>
  <text x="75" y="275" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#8E8E93">12 notes</text>

