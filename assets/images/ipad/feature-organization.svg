  <text x="300" y="144" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#007AFF">🧬</text>
  <text x="297" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#000000">DNA Structure</text>
  <text x="297" y="168" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">Double helix</text>
  <text x="297" y="180" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">Base pairs...</text>

  <!-- Note 3: Cell Membrane -->
  <rect x="174" y="203" width="105" height="70" rx="8" fill="#F8F9FA" stroke="#E5E5EA" stroke-width="1"/>
  <circle cx="190" cy="220" r="8" fill="#34C759" fill-opacity="0.2"/>
  <text x="187" y="224" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#34C759">🔘</text>
  <text x="184" y="235" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#000000">Cell Membrane</text>
  <text x="184" y="248" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">Selective barrier</text>
  <text x="184" y="260" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">Phospholipid...</text>

