  <rect x="287" y="203" width="105" height="70" rx="8" fill="#F8F9FA" stroke="#E5E5EA" stroke-width="1"/>
  <circle cx="303" cy="220" r="8" fill="#FF9500" fill-opacity="0.2"/>
  <text x="300" y="224" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#FF9500">🔸</text>
  <text x="297" y="235" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#000000">Ribosomes</text>
  <text x="297" y="248" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">Protein synthesis</text>
  <text x="297" y="260" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">RNA translation...</text>
