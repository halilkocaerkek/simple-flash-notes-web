  <!-- Note 1: Mitochondria -->
  <rect x="174" y="123" width="105" height="70" rx="8" fill="#F8F9FA" stroke="#E5E5EA" stroke-width="1"/>
  <circle cx="190" cy="140" r="8" fill="#FF3B30" fill-opacity="0.2"/>
  <text x="187" y="144" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#FF3B30">⚡</text>
  <text x="184" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#000000">Mitochondria</text>
  <text x="184" y="168" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">Powerhouse of cell</text>
  <text x="184" y="180" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8E8E93">ATP production...</text>

  <!-- Note 2: DNA Structure -->
  <rect x="287" y="123" width="105" height="70" rx="8" fill="#F8F9FA" stroke="#E5E5EA" stroke-width="1"/>
